<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habibi Mummy</title>
<style>
  :root { --ink:#2b2622; --muted:#6b6259; --bg:#f6efe2; --card:#fffaf0; --rule:#e2d6c1; --link:#8a5a12; --accent:#b8860b; }
  @media (prefers-color-scheme: dark) { :root { --ink:#efe7da; --muted:#b3a897; --bg:#1d1a17; --card:#2a2521; --rule:#3a342d; --link:#e2b25c; --accent:#e2b25c; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width:40rem; margin:0 auto; padding:3rem 1rem 4rem; }
  .card { background:var(--card); border:1px solid var(--rule); border-top:4px solid var(--accent); border-radius:10px; padding:1.5rem 1.25rem; }
  h1 { font-size:1.7rem; margin:0 0 .5rem; line-height:1.25; }
  p { margin:0 0 1rem; }
  ul { list-style:none; margin:1.25rem 0 0; padding:0; border-top:1px solid var(--rule); }
  li { border-bottom:1px solid var(--rule); }
  li a { display:block; padding:.85rem 0; color:var(--link); text-decoration:none; font-weight:bold; }
  li a:hover, li a:focus { text-decoration:underline; }
  .contact { margin-top:1.5rem; color:var(--muted); font-size:.95rem; }
  a { color:var(--link); overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
<div class="card">
  <h1>Habibi Mummy</h1>
  <p>A family-friendly Egyptian tomb platformer. The mummy runs on its own: tap to jump, lash robbers and swing on golden hooks across 150 levels.</p>
  <ul>
    <li><a href="support.html">Support</a></li>
    <li><a href="privacy.html">Privacy Policy</a></li>
  </ul>
</div>
<p class="contact">Contact: <a href="mailto:m.abelhamid88@gmail.com">m.abelhamid88@gmail.com</a></p>
</main>
</body>
</html>
